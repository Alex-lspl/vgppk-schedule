<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#151515">
  <title>Расписание ВГППК</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233F37F0'/%3E%3Cpath d='M8 11h16M8 16h16M8 21h9' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <button class="group" id="groupBtn" type="button" aria-haspopup="dialog">
        <span class="group-num" id="groupName">…</span>
        <span class="group-hint">группа · сменить</span>
      </button>
      <button class="refresh" id="refreshBtn" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/></svg>
        <span>Обновить</span>
      </button>
    </header>

    <p class="status" id="status" role="status" aria-live="polite">Загружаю расписание…</p>

    <div class="controls">
      <nav class="weeks" id="weeks" aria-label="Неделя" hidden></nav>
      <nav class="subgroups" id="subgroups" aria-label="Подгруппа" hidden></nav>
    </div>
    <nav class="days" id="days" aria-label="День недели"></nav>

    <main class="board" id="board"></main>

    <p class="footnote">Это основное расписание. Замены на сайте колледжа не публикуются, смотри их на листочках.</p>
  </div>

  <dialog class="picker" id="picker" aria-label="Выбор группы">
    <div class="picker-head">
      <input id="pickerSearch" type="search" placeholder="Найти группу" autocomplete="off">
      <button id="pickerClose" type="button" class="picker-close">Закрыть</button>
    </div>
    <ul class="picker-list" id="pickerList"></ul>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
