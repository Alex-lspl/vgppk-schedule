<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#151515">
  <title>Расписание ВГППК</title>
  <link rel="icon" href="/icon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.json">
  <!-- Чтобы ярлык «На экран «Домой»» на iPhone открывался без адресной строки Safari
       и с иконкой/названием ниже, а не ссылкой на сайт -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Расписание">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Главная: выбор группы. Показывается при первом заходе и по кнопке «сменить» -->
    <div id="homeView" hidden>
      <header class="home-head">
        <img class="home-logo" src="/icon-128.png" alt="" width="50" height="50">
        <div>
          <div class="home-brand">Расписание занятий</div>
          <div class="home-sub">ГБПОУ ВО «ВГППК»</div>
        </div>
      </header>

      <section class="home-main">
        <button class="home-back" id="homeBack" type="button" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          <span>К расписанию <b id="homeBackName"></b></span>
        </button>

        <div class="home-intro">
          <h1>Выберите свою группу</h1>
          <p>Найдите группу, чтобы посмотреть расписание занятий.<br>Выбор запомнится на этом устройстве.</p>
        </div>

        <label class="home-search">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="homeSearch" type="search" inputmode="search" autocomplete="off" enterkeyhint="go" placeholder="Введите номер группы…" aria-label="Поиск группы">
          <button class="home-clear" id="homeClear" type="button" aria-label="Очистить поиск" hidden>×</button>
        </label>

        <div class="home-meta">
          <span class="home-meta-title">Все группы</span>
          <span class="home-count">Доступно групп: <strong id="homeCount">…</strong></span>
        </div>

        <div class="tiles" id="tiles"></div>
        <div class="home-empty" id="homeEmpty" role="status" hidden></div>
      </section>
    </div>

    <div id="scheduleView" hidden>
    <header class="top">
      <button class="group" id="groupBtn" type="button" aria-haspopup="dialog">
        <span class="group-num" id="groupName">…</span>
        <span class="group-hint">сменить</span>
      </button>
      <button class="refresh" id="refreshBtn" type="button" aria-label="Обновить расписание">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/></svg>
        <span class="refresh-label">Обновить</span>
      </button>
    </header>

    <button class="status" id="statusBtn" type="button" role="status" aria-live="polite" aria-haspopup="dialog">
      <span id="statusText">Загружаю расписание…</span>
      <svg class="status-i" viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="8.2"/><path d="M10 9.2v5" stroke-linecap="round"/><circle cx="10" cy="6.3" r="0.9" fill="currentColor" stroke="none"/></svg>
    </button>

    <div class="controls">
      <nav class="weeks" id="weeks" aria-label="Неделя" hidden></nav>
      <nav class="subgroups" id="subgroups" aria-label="Подгруппа" hidden></nav>
    </div>
    <nav class="days" id="days" aria-label="День недели"></nav>

    <main class="board" id="board"></main>

    </div>

    <footer class="site-footer">
      <span class="tg">
        <!-- https://t.me открывается и в приложении, и в браузере (веб-версия), в отличие от tg://,
             которое без установленного Telegram не делает ничего -->
        <a id="tgLink" href="https://t.me/l_SP_Soft_l" target="_blank" rel="noopener noreferrer">Telegram: @l_SP_Soft_l</a>
        <button class="tg-copy" id="tgCopy" type="button" aria-label="Скопировать @l_SP_Soft_l" title="Скопировать имя в Telegram">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        </button>
        <span class="tg-note" id="tgNote" role="status" aria-live="polite"></span>
      </span>
      <span class="version" id="appVersion" hidden></span>
    </footer>
  </div>

  <dialog class="info" id="infoDialog" aria-label="Как обновляются данные">
    <div class="picker-head">
      <strong>Как это работает</strong>
      <button id="infoClose" type="button" class="picker-close">Закрыть</button>
    </div>
    <div class="info-body" id="infoBody"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
